name: hrbp-one

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrbp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.onprem}
      POSTGRES_DB: ${POSTGRES_DB:-hrbp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrbp} -d ${POSTGRES_DB:-hrbp}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hrbp_internal]

  object-storage:
    image: ${OBJECT_STORAGE_IMAGE:-chrislusf/seaweedfs:4.48}
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-admin.port=12646"]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY in .env.onprem}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY in .env.onprem}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:-hrbp-private}
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    networks: [hrbp_internal]

  object-storage-tool:
    image: ${OBJECT_STORAGE_TOOL_IMAGE:-rclone/rclone:1.75.1}
    profiles: ["tools"]
    environment:
      RCLONE_CONFIG_HRBP_TYPE: s3
      RCLONE_CONFIG_HRBP_PROVIDER: Other
      RCLONE_CONFIG_HRBP_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY in .env.onprem}
      RCLONE_CONFIG_HRBP_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY in .env.onprem}
      RCLONE_CONFIG_HRBP_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://object-storage:8333}
      RCLONE_CONFIG_HRBP_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      RCLONE_CONFIG_HRBP_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-hrbp-private}
    networks: [hrbp_internal]

  schema:
    build:
      context: .
      dockerfile: Dockerfile.onprem
      target: schema
      args:
        GITHUB_SHA: ${GITHUB_SHA:-}
    env_file: ["${HRBP_ENV_FILE:-.env.onprem}"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrbp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hrbp}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [hrbp_internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile.onprem
      target: runtime
      args:
        GITHUB_SHA: ${GITHUB_SHA:-}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: ["${HRBP_ENV_FILE:-.env.onprem}"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrbp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hrbp}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://object-storage:8333}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY in .env.onprem}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY in .env.onprem}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-hrbp-private}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      APP_URL: ${APP_URL:?set APP_URL in .env.onprem}
      HRBP_ALLOW_INSECURE_CONTEXT_HEADERS: "false"
    ports:
      - "${HRBP_HTTP_BIND:-127.0.0.1}:${HRBP_HTTP_PORT:-3000}:3000"
    depends_on:
      schema:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/runtime').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [hrbp_internal]

  document-scanner-engine:
    image: ${DOCUMENT_SCANNER_IMAGE:-clamav/clamav:1.5.4-debian}
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "5"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10
    networks: [hrbp_internal]

  document-scanner:
    build:
      context: .
      dockerfile: Dockerfile.onprem
      target: scanner
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: ["${HRBP_ENV_FILE:-.env.onprem}"]
    environment:
      HRBP_DOCUMENT_SCAN_URL: http://app:3000/api/internal/document-scan
      HRBP_DOCUMENT_SCAN_TOKEN: ${HRBP_DOCUMENT_SCAN_TOKEN:?set HRBP_DOCUMENT_SCAN_TOKEN in .env.onprem}
      HRBP_CLAMD_HOST: document-scanner-engine
      HRBP_CLAMD_PORT: 3310
      HRBP_DOCUMENT_SCAN_STATE_DIR: /var/run/hrbp-scanner
      HRBP_DOCUMENT_SCAN_MAX_BYTES: ${HRBP_DOCUMENT_SCAN_MAX_BYTES:-26214400}
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run/hrbp-scanner:size=4m,mode=0700,uid=1000,gid=1000
    depends_on:
      app:
        condition: service_healthy
      document-scanner-engine:
        condition: service_healthy
    networks: [hrbp_internal]

  maintenance-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.onprem
      target: scheduler
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: ["${HRBP_ENV_FILE:-.env.onprem}"]
    environment:
      HRBP_MAINTENANCE_URL: http://app:3000/api/internal/maintenance
      HRBP_MAINTENANCE_TOKEN: ${HRBP_MAINTENANCE_TOKEN:?set HRBP_MAINTENANCE_TOKEN in .env.onprem}
      HRBP_MAINTENANCE_INTERVAL_SECONDS: ${HRBP_MAINTENANCE_INTERVAL_SECONDS:-900}
      HRBP_MAINTENANCE_STATE_DIR: /var/lib/hrbp-scheduler
    volumes:
      - scheduler_state:/var/lib/hrbp-scheduler
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      app:
        condition: service_healthy
    networks: [hrbp_internal]

volumes:
  postgres_data:
  object_storage_data:
  scheduler_state:
  clamav_db:

networks:
  hrbp_internal:
    driver: bridge
