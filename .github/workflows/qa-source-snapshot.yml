name: QA Source Snapshot
on:
  pull_request:
    paths:
      - '.github/workflows/qa-source-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/hrbp-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: hrbp-remediation-source
          path: ${{ runner.temp }}/hrbp-source.tar
          retention-days: 1
