name: Dependency Lock Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact refreshed graph
        run: npm ci --ignore-scripts
      - name: Record remediated versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const paths = [
            'node_modules/body-parser',
            'node_modules/nodemailer',
            'node_modules/miniflare/node_modules/undici',
            'node_modules/wrangler',
            'node_modules/miniflare'
          ];
          for (const path of paths) console.log(path, lock.packages[path]?.version ?? 'missing');
          NODE
      - name: Preserve regenerated lockfile
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hrbp-dependency-lock-refresh-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high
      - name: Commit verified lockfile to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ui-qa-remediation-20261014'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "fix(deps): refresh audited lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
