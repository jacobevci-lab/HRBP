name: Generate Prisma Baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hrbp-prisma-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  baseline:
    if: ${{ github.event.pull_request.head.ref == 'feat/versioned-schema-migrations-20261006' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - name: Generate deterministic baseline migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hrbp-prisma-baseline
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel ./prisma \
            --script \
            --output /tmp/hrbp-prisma-baseline/migration.sql
          test -s /tmp/hrbp-prisma-baseline/migration.sql
          grep -q 'CREATE TABLE' /tmp/hrbp-prisma-baseline/migration.sql
          echo 'HRBP_PRISMA_BASELINE_BEGIN'
          base64 -w0 /tmp/hrbp-prisma-baseline/migration.sql
          echo
          echo 'HRBP_PRISMA_BASELINE_END'
