name: UI Deep Inspection
on:
  pull_request:
    branches: [main]
    paths:
      - app/module/people/new/**
      - app/module/positions/new/**
      - app/api/hr-service/queues/**
      - app/api/policies/**
      - components/engagement-*
      - components/policy-*
      - components/app-shell.tsx
      - components/navigation-*
      - components/hr-service-queue-admin*
      - lib/engagement-authoring-copy.ts
      - lib/employee-services-live-data.ts
      - scripts/create-page-authorization.test.mjs
      - scripts/engagement-authoring-ui.test.mjs
      - scripts/policy-actions-ui.test.mjs
      - scripts/policy-reader.test.mjs
      - scripts/policy-acknowledgement-metrics.test.mjs
      - scripts/policy-acknowledgement-route.test.mjs
      - scripts/policy-acknowledgement-regression.mjs
      - scripts/ui-deep-audit.mjs
      - scripts/ui-navigation-regression.mjs
      - scripts/ui-queue-regression.mjs
      - scripts/ui-policy-regression.mjs
      - .github/workflows/ui-deep-inspection.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-deep-inspection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://hrbp:disposable-ui-only@127.0.0.1:5432/hrbp_audit
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://hrbp:disposable-ui-only@127.0.0.1:5432/hrbp_audit
      HRBP_DISPOSABLE_AUDIT: "true"
      HRBP_LOCAL_AUTH_ENABLED: "true"
      HRBP_AUTH_TENANT_ID: tenant-acme-global
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize disposable database and ephemeral local secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE hrbp LOGIN PASSWORD 'disposable-ui-only' CREATEDB"
          sudo -u postgres createdb -O hrbp hrbp_audit
          for name in HRBP_SESSION_SECRET HRBP_TEST_ADMIN_PASSWORD HRBP_ENGAGEMENT_RESPONSE_SECRET; do
            value=$(openssl rand -hex 48)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Install application and Chromium
        run: |
          npm ci > .audit/install.log 2>&1
          npm install --no-save --package-lock=false playwright@1.56.1 > .audit/playwright-install.log 2>&1
          npx playwright install --with-deps chromium > .audit/browser-install.log 2>&1
      - name: Authorization, authoring and policy component regression tests
        run: node --test scripts/create-page-authorization.test.mjs scripts/engagement-authoring-ui.test.mjs scripts/policy-actions-ui.test.mjs scripts/policy-reader.test.mjs scripts/policy-acknowledgement-metrics.test.mjs scripts/policy-acknowledgement-route.test.mjs
      - name: Migrate and seed isolated product domains
        run: |
          npx prisma generate > .audit/schema.log 2>&1
          npm run db:migrate:upgrade >> .audit/schema.log 2>&1
          for script in seed-staging seed-work-pay-staging seed-access-staging seed-growth-staging seed-connected-growth-staging seed-services-staging seed-service-governance-staging seed-governance-planning-staging; do
            node "scripts/$script.mjs" >> .audit/seed.log 2>&1 || { tail -40 .audit/seed.log; exit 1; }
          done
      - name: Build actual production application
        run: npx next build > .audit/build.log 2>&1 || { tail -80 .audit/build.log; exit 1; }
      - name: Inspect module views, valid CRUD and real navigation transitions
        run: |
          node node_modules/next/dist/bin/next start --hostname localhost --port 3100 > .audit/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3100/api/health/runtime >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1 || { tail -60 .audit/server.log; exit 1; }
          result=0
          node scripts/ui-deep-audit.mjs || result=1
          node scripts/ui-navigation-regression.mjs || result=1
          node scripts/ui-queue-regression.mjs || result=1
          node scripts/ui-policy-regression.mjs || result=1
          node scripts/policy-acknowledgement-regression.mjs || result=1
          exit "$result"
      - name: Preserve report and synthetic screenshots even on findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrbp-ui-deep-inspection
          path: .audit/
          include-hidden-files: true
          retention-days: 7
