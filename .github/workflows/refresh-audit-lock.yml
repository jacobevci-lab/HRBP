name: Refresh audited dependency lock

on:
  push:
    branches:
      - feat/audit-full-history-resume-20261025
    paths:
      - package.json
      - .github/workflows/refresh-audit-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/audit-full-history-resume-20261025
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm resolver
        run: npm install --global npm@10.9.9
      - name: Resolve lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Enforce full dependency audit
        run: npm audit --audit-level=high
      - name: Commit audited lock candidate
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches the audited dependency graph"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): refresh audited lock for history milestone"
          git push origin HEAD:feat/audit-full-history-resume-20261025
