name: Apply Reviewed Render Fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/platform-audit-20261003' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply only source files at their reviewed versions
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BRANCH=fix/platform-audit-20261003
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
          'components/audit-live-page.tsx':'a442cd08651463572e96a9d8c0ea7f9e9e3157f14a3c30f11c46dfa4b1494904',
          'components/governance-planning-live-workspace.tsx':'fc330e435b0b9f5d68aa1112ea8ad3926c1f80ad5b15b45d96ebefd922414611',
          'app/workflows.css':'454bfbbb89f51e8aec766615aec94542a1b5f2e27a240af183b96d9823ce0f9a',
          'scripts/platform-auth-browser-audit.mjs':'17b8217d15d8b2b6c79ff997db1332272c3d91be3223740a6da443bc122fc2fc',
          'scripts/platform-remediation-gate.mjs':'15d43f07a6aa246a14fe144f378236230b83c73136d507e9667da649667ac82e'}
          for path,digest in expected.items():
            assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest, 'Source changed: '+path
          p=Path('components/audit-live-page.tsx');s=p.read_text().replace('<div className="audit-live-page">','<div className="audit-live-page" data-audit-locale={locale}>')
          s=s.replace('<Link className="secondary-button" href={`/api/audit/export?${exportParams.toString()}`}><Download size={15}/>{c(locale, "Export CSV", "CSV dışa aktar")}</Link>', '<a className="secondary-button" download href={`/api/audit/export?${exportParams.toString()}`}><Download size={15}/>{c(locale, "Export CSV", "CSV dışa aktar")}</a>');p.write_text(s)
          p=Path('components/governance-planning-live-workspace.tsx');p.write_text(p.read_text().replace('<div className="gov-shell">','<div className="gov-shell" data-governance-locale={locale}>'))
          p=Path('app/workflows.css');s=p.read_text().replace('.workflow-decision-history-filters{min-width:0;flex-wrap:wrap}', '.workflow-history-controls{min-width:0;flex-wrap:wrap}')
          s+='''\n/* Native selects must shrink within their grid tracks; wide tables retain local scrolling. */
          @media(max-width:800px){
            .workflow-history-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:100%;min-width:0;max-width:100%}
            .workflow-history-controls>*{min-width:0;max-width:100%;width:100%;box-sizing:border-box}
            .workflow-history-controls .secondary-button{height:auto;min-height:34px;white-space:normal;justify-content:center}
          }
          @media(max-width:760px){.workflow-action-search{flex:0 1 auto;width:100%}}
          ''';p.write_text(s)
          p=Path('scripts/platform-auth-browser-audit.mjs');s=p.read_text();pos=s.index('const browser=await chromium.launch')
          s=s[:pos]+'''// Wait for the server-rendered locale, not only the immediate client toggle state.
          async function waitServerLocale(page, path, locale) {
           const selector=path==='/module/audit'?'.audit-live-page':
            ['/module/engagement','/module/workforce-planning','/module/ai-assistant'].includes(path)?'.gov-shell':null;
           if(!selector)return;
           const attr=path==='/module/audit'?'data-audit-locale':'data-governance-locale';
           await page.locator(`${selector}[${attr}="${locale}"]`).waitFor({timeout:10000});
          }
          '''+s[pos:]
          s=s.replace("await page.locator('.locale-toggle button').filter({hasText:'TR'}).click();await page.waitForLoadState('networkidle');", "await page.locator('.locale-toggle button').filter({hasText:'TR'}).click();await waitServerLocale(page,path,'tr');await page.waitForLoadState('networkidle');")
          s=s.replace("await page.locator('.locale-toggle button').filter({hasText:'EN'}).click();await page.waitForLoadState('networkidle');", "await page.locator('.locale-toggle button').filter({hasText:'EN'}).click();await waitServerLocale(page,path,'en');await page.waitForLoadState('networkidle');");p.write_text(s)
          p=Path('scripts/platform-remediation-gate.mjs');s=p.read_text().replace("check('No browser errors or 5xx',", "check('Primary browser sweep has no navigation, JavaScript or server errors',base.browser500.length===0&&base.browserJsErrors.length===0&&base.serverFailurePages.length===0,{navigation:base.browser500,js:base.browserJsErrors,server:base.serverFailurePages});\ncheck('Both mobile sweeps fit the document',base.mobileOverflow.length===0&&browser.mobileOverflow.length===0,{primary:base.mobileOverflow,principalVerified:browser.mobileOverflow});\ncheck('No browser errors or 5xx',");p.write_text(s)
          PY
          git diff --check
          git add components/audit-live-page.tsx components/governance-planning-live-workspace.tsx app/workflows.css scripts/platform-auth-browser-audit.mjs scripts/platform-remediation-gate.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: use native audit downloads and fit workflow controls on mobile'
          git push origin HEAD:refs/heads/$BRANCH
