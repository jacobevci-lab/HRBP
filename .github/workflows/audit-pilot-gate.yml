name: Audit Pilot Gate

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hrbp-audit-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-pilot-gate:
    name: Audit pilot evidence preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          check-latest: false
      - name: Verify offline pilot evidence and CI contract
        run: npm run audit-pilot:validate
