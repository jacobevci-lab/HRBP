name: Locale Diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'fix/platform-audit-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrbp
          POSTGRES_PASSWORD: disposable-audit-only
          POSTGRES_DB: hrbp_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hrbp -d hrbp_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hrbp:disposable-audit-only@127.0.0.1:5432/hrbp_audit
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://hrbp:disposable-audit-only@127.0.0.1:5432/hrbp_audit
      HRBP_DISPOSABLE_AUDIT: 'true'
      HRBP_LOCAL_AUTH_ENABLED: 'true'
      HRBP_AUTH_TENANT_ID: tenant-acme-global
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare disposable runtime
        run: |
          mkdir -p .diagnostics
          git archive --format=tar.gz HEAD > .diagnostics/reviewed-source.tar.gz
          for name in HRBP_SESSION_SECRET HRBP_TEST_ADMIN_PASSWORD HRBP_ENGAGEMENT_RESPONSE_SECRET; do
            value=$(openssl rand -hex 48)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          npm install > .diagnostics/install.log 2>&1
          npm install --no-save --package-lock=false playwright@1.56.1 >> .diagnostics/install.log 2>&1
          npx playwright install --with-deps chromium > .diagnostics/browser-install.log 2>&1
          npx prisma generate
          npx prisma db push
          for script in seed-staging seed-work-pay-staging seed-access-staging seed-growth-staging seed-connected-growth-staging seed-services-staging seed-service-governance-staging seed-governance-planning-staging; do node "scripts/$script.mjs" >> .diagnostics/seed.log 2>&1; done
          npx next build > .diagnostics/build.log 2>&1 || { tail -60 .diagnostics/build.log; exit 1; }
      - name: Compare exact locale wait and preference initialization
        run: |
          npx next start --hostname localhost --port 3100 > .diagnostics/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3100/api/health/runtime > /dev/null; then break; fi
            sleep 1
          done
          node scripts/audit-locale-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrbp-locale-diagnostics
          path: .diagnostics/
          include-hidden-files: true
          retention-days: 7
