name: Locale Diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'fix/platform-audit-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrbp
          POSTGRES_PASSWORD: disposable-audit-only
          POSTGRES_DB: hrbp_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hrbp -d hrbp_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hrbp:disposable-audit-only@127.0.0.1:5432/hrbp_audit
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://hrbp:disposable-audit-only@127.0.0.1:5432/hrbp_audit
      HRBP_DISPOSABLE_AUDIT: 'true'
      HRBP_LOCAL_AUTH_ENABLED: 'true'
      HRBP_AUTH_TENANT_ID: tenant-acme-global
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare disposable runtime
        run: |
          mkdir -p .diagnostics
          for name in HRBP_SESSION_SECRET HRBP_TEST_ADMIN_PASSWORD HRBP_ENGAGEMENT_RESPONSE_SECRET; do
            value=$(openssl rand -hex 48)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          npm install > .diagnostics/install.log 2>&1
          npm install --no-save --package-lock=false playwright@1.56.1 >> .diagnostics/install.log 2>&1
          npx playwright install --with-deps chromium > .diagnostics/browser-install.log 2>&1
          npx prisma generate
          npx prisma db push
          for script in seed-staging seed-work-pay-staging seed-access-staging seed-growth-staging seed-connected-growth-staging seed-services-staging seed-service-governance-staging seed-governance-planning-staging; do node "scripts/$script.mjs" >> .diagnostics/seed.log 2>&1; done
          npx next build > .diagnostics/build.log 2>&1 || { tail -60 .diagnostics/build.log; exit 1; }
      - name: Inspect locale request and rendered result
        run: |
          npx next start --hostname localhost --port 3100 > .diagnostics/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3100/api/health/runtime > /dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          import { setTimeout as sleep } from 'node:timers/promises';
          const origin='http://localhost:3100', report=[];
          const login=await fetch(origin+'/api/auth/local',{method:'POST',headers:{origin,'content-type':'application/json'},body:JSON.stringify({identifier:'local.admin',password:process.env.HRBP_TEST_ADMIN_PASSWORD})});
          if(login.status!==200)throw Error('Disposable login failed '+login.status);
          const raw=login.headers.get('set-cookie').split(';')[0],i=raw.indexOf('=');
          const cookie={name:raw.slice(0,i),value:decodeURIComponent(raw.slice(i+1)),url:origin};
          const browser=await chromium.launch();
          try{
           for(const blockSelfPrefetch of [false,true]){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});await context.addCookies([cookie]);
            await context.route('**/*',r=>{const u=new URL(r.request().url()),h=r.request().headers();return u.origin!==origin||(blockSelfPrefetch&&u.pathname==='/module/audit'&&h['next-router-prefetch'])?r.abort():r.continue();});
            const page=await context.newPage(),events=[],bodies=[];
            page.on('request',r=>{const u=new URL(r.url());if(u.pathname==='/module/audit'){const h=r.headers();events.push({type:'request',rsc:h.rsc||null,prefetch:h['next-router-prefetch']||null,method:r.method()});}});
            page.on('requestfailed',r=>{if(new URL(r.url()).pathname==='/module/audit')events.push({type:'failed',error:r.failure()?.errorText});});
            page.on('response',r=>{const u=new URL(r.url());if(u.pathname==='/module/audit'){const h=r.headers();events.push({type:'response-headers',status:r.status(),contentType:h['content-type']});const p=r.text().then(t=>events.push({type:'response',status:r.status(),contentType:h['content-type'],cache:h['cache-control'],localeFragments:[...t.matchAll(/data-audit-locale.{0,35}/g)].map(x=>x[0]).slice(0,6)})).catch(e=>events.push({type:'response-read',error:e.name}));bodies.push(p);}});
            const snap=()=>page.evaluate(()=>({lang:document.documentElement.lang,locale:document.cookie.split(';').filter(x=>x.trim().startsWith('hrbp-locale=')),stored:localStorage.getItem('hrbp-locale'),server:document.querySelector('.audit-live-page')?.getAttribute('data-audit-locale'),heading:document.querySelector('.audit-live-page h1')?.textContent,buttons:[...document.querySelectorAll('.locale-toggle button')].map(b=>({text:b.textContent,pressed:b.getAttribute('aria-pressed')}))}));
            await page.goto(origin+'/module/audit',{waitUntil:'networkidle'});const before=await snap();
            await page.locator('.locale-toggle button').filter({hasText:'TR'}).click();
            await page.waitForTimeout(3500);const after=await snap();
            const rawHtml=await context.request.get(origin+'/module/audit');const html=await rawHtml.text();
            const direct={status:rawHtml.status(),localeFragments:[...html.matchAll(/data-audit-locale.{0,35}/g)].map(x=>x[0]).slice(0,6)};
            await page.reload({waitUntil:'networkidle'});const reload=await snap();
            await Promise.race([Promise.allSettled(bodies),sleep(5000)]);
            report.push({intervention:blockSelfPrefetch?'block self-prefetch ONLY':'NONE',before,after,direct,reload,events});
            console.log('LOCALE_DIAGNOSTIC '+JSON.stringify(report.at(-1)));await context.close();
           }
          }finally{await browser.close();await writeFile('.diagnostics/locale.json',JSON.stringify(report,null,2));}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrbp-locale-diagnostics
          path: .diagnostics/
          include-hidden-files: true
          retention-days: 7
