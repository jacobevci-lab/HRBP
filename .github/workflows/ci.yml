name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hrbp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hrbp:hrbp@localhost:5432/hrbp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Production dependency audit
        run: npm run security:audit:prod
      - name: Full dependency audit
        run: npm run security:audit:full
      - run: npm run routes:validate
      - run: npm run ui:validate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run build
      - name: Verify Prisma query compiler is traced
        shell: bash
        run: |
          set -euo pipefail
          expected=".next/standalone/node_modules/.prisma/client/query_compiler_bg.wasm"
          if [ ! -f "$expected" ]; then
            echo "Prisma query compiler WASM is missing from the Next.js standalone trace: $expected"
            echo "Generated Prisma WASM files:"
            find node_modules/.prisma/client -maxdepth 1 -name '*.wasm' -print || true
            echo "Standalone Prisma files:"
            find .next/standalone -path '*/node_modules/.prisma/client/*' -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$expected"
      - run: npm run cf:build
      - name: Verify Prisma query compiler reaches OpenNext output
        shell: bash
        run: |
          set -euo pipefail
          match="$(find .open-next -name 'query_compiler_bg.wasm' -print -quit 2>/dev/null || true)"
          if [ -z "$match" ]; then
            echo "Prisma query compiler WASM is missing from .open-next output."
            find .open-next -path '*/node_modules/.prisma/client/*' -print 2>/dev/null || true
            exit 1
          fi
          echo "Prisma query compiler WASM bundled at: $match"
          ls -lh "$match"
      - name: Smoke test Cloudflare Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --port 8787 > /tmp/hrbp-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill $WRANGLER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/api/health/runtime > /tmp/hrbp-health.json; then
              cat /tmp/hrbp-health.json
              exit 0
            fi
            sleep 1
          done
          echo 'Worker runtime smoke test failed'
          cat /tmp/hrbp-wrangler.log
          exit 1
