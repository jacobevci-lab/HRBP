name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hrbp:hrbp@localhost:5432/hrbp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run build
      - run: npm run cf:build
