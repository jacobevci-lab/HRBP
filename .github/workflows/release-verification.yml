name: Release Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Full 40-character commit expected on the live HRBP domain (empty uses this workflow commit)
        type: string
        required: false
        default: ''
      expected_provider_version_id:
        description: Full Cloudflare Worker Version ID from the successful provider deployment
        type: string
        required: true
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify revision and provider-version contracts
        run: npm run deployment-verification:validate
  live:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HRBP_VERIFY_ORIGIN: https://hrbp.fornostsecurity.com
      HRBP_EXPECTED_REVISION: ${{ inputs.expected_revision || github.sha }}
      HRBP_EXPECTED_PROVIDER_VERSION_ID: ${{ inputs.expected_provider_version_id }}
      HRBP_REQUIRE_PROVIDER_VERSION: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: One anonymous read-only probe of deployed revision and provider Version ID
        run: node scripts/verify-deployment.mjs
