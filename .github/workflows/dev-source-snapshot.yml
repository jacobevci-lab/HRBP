name: Development Source Snapshot
on:
  push:
    branches: [fix/action-center-source-health-20261005]
    paths: [.github/workflows/dev-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3aed613552be3759daf59a29ef3bdce710182314
          persist-credentials: false
      - name: Archive tracked baseline for isolated development verification
        run: |
          git archive --format=zip --output=baseline-source.zip HEAD
          sha256sum baseline-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hrbp-development-baseline
          path: baseline-source.zip
          retention-days: 1
