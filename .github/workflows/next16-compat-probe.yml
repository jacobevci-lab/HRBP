name: Supported Framework Probe
on:
  push:
    branches: [chore/build-compat-probe-20261021]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Only immutable candidate blobs; no ref update or deployment.
    env:
      DATABASE_URL: postgresql://hrbp:disposable-probe-only@localhost:5432/hrbp_probe
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the audited lint repair
        run: |
          mkdir -p .framework-evidence/candidate/scripts
          git rev-parse HEAD > .framework-evidence/source-commit.txt
          npm ci > .framework-evidence/baseline-install.log 2>&1
      - name: Resolve supported runtime with the existing audited lint configuration
        run: |
          npm install --save-exact --ignore-scripts next@16.4.2 > .framework-evidence/install.log 2>&1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(fs.readFileSync('package.json'));
          p.scripts['lint:app']='eslint app components lib';
          p.scripts.prebuild='npm run lint:app && '+p.scripts.prebuild;
          assert.equal(p.scripts.build,'npm run db:generate && next build');
          p.scripts.build='npm run db:generate && next build --webpack';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          const file='scripts/validate-lint-compat.mjs';let text=fs.readFileSync(file,'utf8');
          const needle="assert.match(require('next/package.json').version,/^15\\./";
          assert.ok(text.includes(needle));text=text.replace(needle,"assert.match(require('next/package.json').version,/^16\\./");
          fs.writeFileSync(file,text);
          for(const file of ['package.json','package-lock.json','eslint.config.mjs','scripts/validate-lint-compat.mjs'])fs.copyFileSync(file,`.framework-evidence/candidate/${file}`);
          NODE
          node scripts/verify-audit-runtime.mjs > .framework-evidence/runtime.json
          npm audit --json > .framework-evidence/npm-audit.json
      - name: Prepare a disposable PostgreSQL database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE hrbp LOGIN PASSWORD 'disposable-probe-only' CREATEDB"
          sudo -u postgres createdb -O hrbp hrbp_probe
          npm run db:generate > .framework-evidence/schema.log 2>&1
          npm run db:migrate:upgrade >> .framework-evidence/schema.log 2>&1
      - name: Typecheck, explicit application lint and actual-config regression
        run: |
          npm run typecheck > .framework-evidence/typecheck.log 2>&1
          npm run lint:app > .framework-evidence/lint.log 2>&1
          npm run lint-compat:validate > .framework-evidence/lint-regression.log 2>&1
      - name: Build the real Cloudflare adapter without support-check bypass
        run: npm run cf:build > .framework-evidence/cloudflare-build.log 2>&1
      - name: Preserve immutable candidates without accepting or deploying them
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');const blobs={};
            for(const file of ['package.json','package-lock.json','eslint.config.mjs','scripts/validate-lint-compat.mjs']) {
              const path=`.framework-evidence/candidate/${file}`;
              if(!fs.existsSync(path)) continue;
              const data=fs.readFileSync(path);
              const result=await github.rest.git.createBlob({...context.repo,content:data.toString('base64'),encoding:'base64'});
              blobs[file]={sha:result.data.sha,bytes:data.length};
            }
            fs.writeFileSync('.framework-evidence/candidate-blobs.json',JSON.stringify(blobs,null,2));
      - name: Preserve candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrbp-supported-framework-probe
          path: .framework-evidence/
          include-hidden-files: true
          retention-days: 7
