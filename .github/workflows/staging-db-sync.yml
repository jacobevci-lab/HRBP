name: Staging DB Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.HRBP_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - name: Verify staging database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "HRBP_STAGING_DATABASE_URL is not configured"
            exit 1
          fi
      - name: Synchronize staging schema
        run: npx prisma db push
      - name: Grant runtime role access
        run: |
          cat <<'SQL' | npx prisma db execute --stdin --schema ./prisma/schema.prisma
          GRANT USAGE ON SCHEMA public TO hrbp_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO hrbp_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO hrbp_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO hrbp_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO hrbp_app;
          SQL
      - run: npx prisma generate --no-engine
