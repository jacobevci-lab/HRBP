name: Staging DB Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.HRBP_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - name: Verify staging database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "HRBP_STAGING_DATABASE_URL is not configured"
            exit 1
          fi
      - name: Synchronize staging schema
        run: npx prisma db push
      - name: Generate Prisma client for staging seed
        run: npx prisma generate
      - name: Seed enterprise staging workspace
        run: node scripts/seed-staging.mjs
      - name: Seed work, leave, compensation and payroll domains
        run: node scripts/seed-work-pay-staging.mjs
      - name: Seed relationship-aware access grants
        run: node scripts/seed-access-staging.mjs
      - name: Seed growth and talent domains
        run: node scripts/seed-growth-staging.mjs
      - name: Connect succession development to learning and skills
        run: node scripts/seed-connected-growth-staging.mjs
      - name: Seed employee-services domains
        run: node scripts/seed-services-staging.mjs
      - name: Seed service queue and policy governance controls
        run: node scripts/seed-service-governance-staging.mjs
      - name: Seed governance, planning and privacy domains
        run: node scripts/seed-governance-planning-staging.mjs
      - name: Grant runtime role access
        run: |
          cat <<'SQL' | npx prisma db execute --stdin --schema ./prisma/schema.prisma
          GRANT USAGE ON SCHEMA public TO hrbp_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO hrbp_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO hrbp_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO hrbp_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO hrbp_app;
          SQL
      - name: Verify staging schema and vertical-slice data
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          const db = new PrismaClient();
          const [
            tenants, people, positions,
            timeEntries, leaveRequests, compChanges, payrollRuns, payrollResults,
            accessGrants, jurisdictions, goals, reviews, serviceRequests, serviceQueues, queueMembers,
            policies, policyExceptions, workflows,
            campaigns, scenarios, metrics, metricSnapshots, processing, dsrs,
            connectedGrowthAssignments, developmentPlans, notificationOutbox, invalidMetricScopes
          ] = await Promise.all([
            db.tenant.count(),
            db.person.count(),
            db.position.count(),
            db.timeEntry.count(),
            db.leaveRequest.count(),
            db.compensationChange.count(),
            db.payrollRun.count(),
            db.payrollResult.count(),
            db.employmentAccessGrant.count(),
            db.employmentJurisdiction.count(),
            db.goal.count(),
            db.performanceReview.count(),
            db.hRServiceRequest.count(),
            db.hRServiceQueue.count(),
            db.hRServiceQueueMembership.count(),
            db.policyRecord.count(),
            db.policyException.count(),
            db.workflowDefinition.count(),
            db.surveyCampaign.count(),
            db.workforceScenario.count(),
            db.metricDefinition.count(),
            db.metricSnapshot.count(),
            db.processingActivity.count(),
            db.dataSubjectRequest.count(),
            db.learningAssignment.count({
              where: {
                successionCandidateId: { not: null },
                developmentPlanId: { not: null },
                developmentSkillId: { not: null },
                targetProficiency: { not: null }
              }
            }),
            db.developmentPlan.count({
              where: {
                successionCandidateId: { not: null },
                focusSkillId: { not: null },
                targetProficiency: { not: null }
              }
            }),
            db.notificationOutbox.count(),
            db.metricSnapshot.count({
              where: {
                OR: [
                  { populationScope: 'TENANT', scopeFingerprint: { not: null } },
                  { populationScope: 'EMPLOYMENT_SET', scopeFingerprint: null }
                ]
              }
            })
          ]);
          const counts = {
            tenants, people, positions,
            timeEntries, leaveRequests, compChanges, payrollRuns, payrollResults,
            accessGrants, jurisdictions, goals, reviews, serviceRequests, serviceQueues, queueMembers,
            policies, policyExceptions, workflows,
            campaigns, scenarios, metrics, metricSnapshots, processing, dsrs,
            connectedGrowthAssignments, developmentPlans
          };
          console.log({ ...counts, notificationOutbox, invalidMetricScopes });
          if (Object.values(counts).some((value) => value < 1)) process.exit(1);
          if (invalidMetricScopes > 0) {
            console.error('Analytics snapshot scope integrity check failed.');
            process.exit(1);
          }
          await db.$disconnect();
          NODE
