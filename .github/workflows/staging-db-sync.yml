name: Staging DB Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.HRBP_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - name: Verify staging database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "HRBP_STAGING_DATABASE_URL is not configured"
            exit 1
          fi
      - name: Synchronize staging schema
        run: npx prisma db push
      - name: Generate Prisma client for staging seed
        run: npx prisma generate
      - name: Seed enterprise staging workspace
        run: node scripts/seed-staging.mjs
      - name: Grant runtime role access
        run: |
          cat <<'SQL' | npx prisma db execute --stdin --schema ./prisma/schema.prisma
          GRANT USAGE ON SCHEMA public TO hrbp_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO hrbp_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO hrbp_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO hrbp_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO hrbp_app;
          SQL
      - name: Verify staging schema
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          const db = new PrismaClient();
          const [tenants, people, positions] = await Promise.all([
            db.tenant.count(),
            db.person.count(),
            db.position.count()
          ]);
          console.log({ tenants, people, positions });
          if (tenants < 1 || people < 1 || positions < 1) process.exit(1);
          await db.$disconnect();
          NODE
