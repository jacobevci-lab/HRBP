name: Operational Maintenance

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Run all jobs separately, or rerun one inspected job"
        type: choice
        required: true
        default: all
        options:
          - all
          - benefits-lifecycle
          - learning-lifecycle
          - recruiting-lifecycle
          - onboarding-readiness
          - offboarding-readiness
          - workflow-reminders
          - learning-reminders
          - succession-reminders
          - development-plan-reminders
          - audit-integrity
          - operational-maintenance

permissions:
  contents: read

concurrency:
  group: hrbp-operational-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HRBP_MAINTENANCE_URL: ${{ secrets.HRBP_MAINTENANCE_URL }}
      HRBP_MAINTENANCE_TOKEN: ${{ secrets.HRBP_MAINTENANCE_TOKEN }}
      HRBP_MAINTENANCE_JOB: ${{ inputs.job || 'all' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Validate scheduler configuration
        id: config
        shell: bash
        run: |
          if [ -z "$HRBP_MAINTENANCE_URL" ] || [ -z "$HRBP_MAINTENANCE_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "HRBP_MAINTENANCE_URL and HRBP_MAINTENANCE_TOKEN repository secrets are required."
              exit 1
            fi
            echo "::warning::Operational maintenance scheduler is not configured; scheduled invocation skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { validateConfiguration } from './scripts/run-operational-maintenance.mjs';
          validateConfiguration({
            url: process.env.HRBP_MAINTENANCE_URL,
            token: process.env.HRBP_MAINTENANCE_TOKEN,
            job: process.env.HRBP_MAINTENANCE_JOB
          });
          NODE
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run individually bounded maintenance jobs
        if: steps.config.outputs.configured == 'true'
        run: node scripts/run-operational-maintenance.mjs
