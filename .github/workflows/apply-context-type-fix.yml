name: Apply Context Type Correction
on:
  pull_request:
    paths: ['.github/workflows/apply-context-type-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/platform-audit-20261003' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact context type and integer-expiry correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = ['app/api/engagement/campaigns/[id]/responses/route.ts', 'app/api/engagement/surveys/[id]/route.ts', 'app/api/engagement/surveys/[id]/questions/[questionId]/route.ts', 'app/api/workforce-planning/scenarios/[id]/lines/route.ts', 'app/api/workforce-planning/scenarios/[id]/lines/[lineId]/route.ts']
          count = 0
          for name in paths:
              p = Path(name); s = p.read_text(); count += s.count('NonNullable<ReturnType<typeof getRequestContext>>')
              p.write_text(s.replace('NonNullable<ReturnType<typeof getRequestContext>>', 'NonNullable<Awaited<ReturnType<typeof getRequestContext>>>'))
          assert count == 6, 'Source type contract changed; stop rather than guess'
          p=Path('lib/auth-session.ts'); s=p.read_text(); assert s.count('issuedAt + ttlHours * 60 * 60') == 1
          p.write_text(s.replace('issuedAt + ttlHours * 60 * 60', 'issuedAt + Math.floor(ttlHours * 60 * 60)'))
          p=Path('components/governance-planning-live-workspace.tsx'); p.write_text('\n'.join(l.rstrip() for l in p.read_text().splitlines())+'\n')
          p=Path('scripts/platform-remediation.test.mjs'); p.write_text(p.read_text()+"\ntest('helper context types unwrap asynchronous account verification',()=>{for(const f of files('app').filter(f=>f.endsWith('.ts')))assert.doesNotMatch(readFileSync(f,'utf8'),/NonNullable<ReturnType<typeof getRequestContext>>/,f);});\n")
          PY
          git add app components lib scripts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unwrap asynchronous context types and bound session expiry to integer seconds'
          git push origin HEAD:refs/heads/fix/platform-audit-20261003
