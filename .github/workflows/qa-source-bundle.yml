name: QA Source Bundle

on:
  push:
    branches: [fix/ui-qa-remediation-20261014]
    paths: [.github/workflows/qa-source-bundle.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-source"
          git rev-parse HEAD > "$RUNNER_TEMP/qa-source/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/qa-source/tree.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/qa-source/source.tar.gz"
          cd "$RUNNER_TEMP/qa-source"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hrbp-qa-source
          path: ${{ runner.temp }}/qa-source/
          retention-days: 1
          if-no-files-found: error
